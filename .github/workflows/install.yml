name: Windows GUI package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        default: '0.2.0-dev'
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bundled runtime and GUI
        shell: pwsh
        run: |
          ./tools/run_gui.ps1 -PrepareOnly
          ./runtimes/node/node.exe tools/setup_dotnet.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          ./runtimes/node/node.exe tools/test_gui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./runtimes/node/node.exe tools/package_gui.mjs $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MaaNightfall-win-x86_64
          path: dist/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
